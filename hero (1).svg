<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x2="0" y2="1">
    <stop stop-color="#150a24"/>
    <stop offset=".55" stop-color="#2c1240"/>
    <stop offset="1" stop-color="#3a1735"/>
  </linearGradient>
  <linearGradient id="desk" x2="0" y2="1">
    <stop stop-color="#7a4560"/>
    <stop offset="1" stop-color="#48273f"/>
  </linearGradient>
  <linearGradient id="screen" x2="0" y2="1">
    <stop stop-color="#2a1440"/>
    <stop offset="1" stop-color="#160c2a"/>
  </linearGradient>
  <linearGradient id="screenGlow" x2="0" y2="1">
    <stop stop-color="#ff9ad6" stop-opacity=".16"/>
    <stop offset="1" stop-color="#ff9ad6" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffd1e8" stop-opacity=".85"/>
    <stop offset="100%" stop-color="#ffd1e8" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
</defs>

<!-- night backdrop -->
<rect width="1200" height="700" fill="url(#bg)"/>
<circle cx="150" cy="140" r="170" fill="#ff4fba" opacity=".10" filter="url(#soft)"/>
<circle cx="1060" cy="500" r="200" fill="#8a6bff" opacity=".10" filter="url(#soft)"/>

<!-- stars -->
<g fill="#ffe9f5">
  <circle cx="90" cy="60" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="220" cy="110" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="330" cy="55" r="2"><animate attributeName="opacity" values=".3;1;.3" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="180" r="1.6"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="470" cy="80" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="1120" cy="140" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="1160" cy="230" r="1.6"><animate attributeName="opacity" values=".3;1;.3" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="740" cy="45" r="1.6"><animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="980" cy="90" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="620" cy="120" r="1.4"><animate attributeName="opacity" values="1;.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
</g>

<!-- moon -->
<circle cx="1095" cy="95" r="80" fill="url(#moonGlow)"/>
<circle cx="1095" cy="95" r="42" fill="#ffe9f5"/>
<circle cx="1111" cy="82" r="8" fill="#f4c9de" opacity=".6"/>
<circle cx="1080" cy="108" r="5" fill="#f4c9de" opacity=".5"/>

<!-- fairy lights -->
<path d="M40,50 Q600,10 1160,50" stroke="#6f4a63" stroke-width="2" fill="none" opacity=".7"/>
<g>
  <circle cx="140" cy="40" r="4" fill="#ffb6d9"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="330" cy="22" r="4" fill="#f5c98a"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="530" cy="13" r="4" fill="#ffb6d9"><animate attributeName="opacity" values=".3;1;.3" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="730" cy="13" r="4" fill="#f5c98a"><animate attributeName="opacity" values="1;.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
  <circle cx="930" cy="22" r="4" fill="#ffb6d9"><animate attributeName="opacity" values=".3;1;.3" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="40" r="4" fill="#f5c98a"><animate attributeName="opacity" values="1;.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
</g>

<!-- glowing headline -->
<text x="600" y="160" text-anchor="middle" font-family="Verdana,sans-serif" font-size="46" font-weight="700"
      fill="#ffd6f3" filter="url(#glow)">WELCOME TO</text>
<text x="600" y="222" text-anchor="middle" font-family="Verdana,sans-serif" font-size="60" font-weight="700"
      fill="#ff7bc9" filter="url(#glow)">
  WREN'S SPACE
  <animate attributeName="opacity" values=".7;1;.7" dur="2.5s" repeatCount="indefinite"/>
</text>
<text x="600" y="260" text-anchor="middle" font-family="monospace" font-size="16" fill="#ffb8e1">code • coffee • create</text>

<!-- floating sparkles -->
<g fill="#ffd3ed" filter="url(#glow)">
 <path d="M200 300 l6 15 15 6-15 6-6 15-6-15-15-6 15-6Z">
  <animateTransform attributeName="transform" type="rotate" values="0 200 300;180 200 300;360 200 300" dur="4s" repeatCount="indefinite"/>
 </path>
 <path d="M1000 300 l5 13 13 5-13 5-5 13-5-13-13-5 13-5Z"/>
</g>

<!-- desk -->
<path d="M0 470 Q300 445 600 465 T1200 455 V700 H0Z" fill="url(#desk)"/>
<path d="M0 480 Q300 455 600 475 T1200 465" fill="none" stroke="#ff9ecb" stroke-width="3" opacity=".35"/>

<!-- laptop -->
<g>
  <ellipse cx="600" cy="565" rx="330" ry="30" fill="#0d0616" opacity=".35"/>
  <rect x="385" y="230" width="430" height="270" rx="22" fill="#241333" stroke="#0c0918" stroke-width="11"/>
  <rect x="410" y="255" width="380" height="220" rx="14" fill="url(#screen)" stroke="#7a5590" stroke-width="4"/>
  <rect x="410" y="255" width="380" height="220" rx="14" fill="url(#screenGlow)"/>
  <g font-family="monospace" font-size="17">
    <text x="435" y="290" fill="#ff8fd2">$ npm run wren</text>
    <text x="435" y="323" fill="#9df7d2">&gt; building creative-space...</text>
    <text x="435" y="360" fill="#b9a6ff">const coffee = true;</text>
    <text x="435" y="395" fill="#ffca83">while (coding) &#123;</text>
    <text x="455" y="428" fill="#8fe9ff">createSomethingCute();</text>
    <text x="435" y="458" fill="#ffca83">&#125;</text>
    <rect x="455" y="462" width="9" height="18" fill="#ff8fd2"><animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/></rect>
  </g>
  <path d="M345 500 L855 500 L900 537 Q908 550 875 555 L320 555 Q300 548 312 533Z"
        fill="#3a2a4a" stroke="#171126" stroke-width="9"/>
  <rect x="550" y="512" width="120" height="13" rx="7" fill="#75577f"/>
</g>

<!-- coffee mug -->
<g>
 <ellipse cx="960" cy="565" rx="66" ry="15" fill="#2f1830" opacity=".4"/>
 <path d="M902 480 Q960 462 1018 480 L1009 585 Q960 608 911 585Z"
       fill="#f5d8e9" stroke="#29152e" stroke-width="8"/>
 <ellipse cx="960" cy="480" rx="58" ry="16" fill="#fff0f7" stroke="#29152e" stroke-width="7"/>
 <ellipse cx="960" cy="480" rx="48" ry="11" fill="#5a3045"/>
 <path d="M1018 502 Q1080 490 1080 538 Q1076 576 1018 564" fill="none" stroke="#29152e" stroke-width="9"/>
 <path d="M1018 511 Q1058 507 1058 538 Q1054 559 1018 553" fill="none" stroke="#f5d8e9" stroke-width="9"/>
 <path d="M948 512 C935 499 940 486 948 476 C957 464 957 451 948 442
          M970 512 C957 495 966 478 975 469 C984 456 980 445 973 436"
       fill="none" stroke="#ffe1f2" stroke-width="5" stroke-linecap="round">
   <animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/>
 </path>
 <text x="960" y="546" text-anchor="middle" font-family="Verdana" font-size="15" fill="#a45a80">WREN ♡</text>
</g>

<!-- plant -->
<g>
  <path d="M140 560 l32 0 l-7 -30 l-18 0 z" fill="#c9628a"/>
  <ellipse cx="156" cy="500" rx="10" ry="26" fill="#6f9b70" transform="rotate(-22 156 500)"/>
  <ellipse cx="156" cy="500" rx="10" ry="26" fill="#5f8b62" transform="rotate(20 156 500)"/>
  <ellipse cx="156" cy="490" rx="10" ry="28" fill="#7fae82"/>
</g>

<!-- books -->
<g font-family="Verdana" font-size="16" font-weight="700">
 <rect x="220" y="470" width="140" height="34" rx="5" fill="#392452"/><text x="290" y="493" text-anchor="middle" fill="#ffacd9">JAVA ♡</text>
 <rect x="212" y="506" width="150" height="34" rx="5" fill="#49315c"/><text x="287" y="529" text-anchor="middle" fill="#ffb6df">DSA ♡</text>
</g>

<text x="600" y="655" text-anchor="middle" font-family="monospace" font-size="17" fill="#eab9da" opacity=".8">
  coding • coffee • creativity • repeat
</text>
</svg>
